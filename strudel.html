<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Strudel Remote v9</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #0d0d0d;
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            color: #c8c8c8;
        }

        #overlay {
            position: fixed; inset: 0;
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 100;
        }

        #overlay button {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 18px 40px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.15s;
        }

        #overlay button:hover { background: #ff6b80; }

        #init-status { font-size: 12px; color: #555; }

        #console {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #log {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        .entry {
            margin-bottom: 10px;
            border-left: 3px solid #333;
            padding: 6px 10px;
        }

        .entry .meta { font-size: 11px; color: #666; margin-bottom: 4px; }

        .entry pre {
            font-size: 13px;
            line-height: 1.45;
            color: #a6e3a1;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .entry .badge {
            display: inline-block;
            margin-top: 4px;
            padding: 1px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
        }

        .entry.ok   { border-color: #a6e3a1; }
        .entry.ok  .badge { background: #1a3a1a; color: #a6e3a1; }
        .entry.err  { border-color: #e94560; }
        .entry.err pre { color: #f38ba8; }
        .entry.err .badge { background: #3a1a1a; color: #e94560; }

        #footer {
            border-top: 1px solid #222;
            padding: 8px 16px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #555;
            flex-shrink: 0;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: #e94560; flex-shrink: 0; }
        .dot.connected { background: #a6e3a1; }

        #log::-webkit-scrollbar { width: 6px; }
        #log::-webkit-scrollbar-track { background: transparent; }
        #log::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>

<div id="overlay">
    <button id="start-btn">Start Audio &amp; Connect (v9)</button>
    <div id="init-status">Loading Strudel...</div>
</div>

<div id="console">
    <div id="log"></div>
    <div id="footer">
        <div class="dot" id="dot"></div>
        <span id="conn-status">Disconnected</span>
        <span id="track-info" style="margin-left:auto">v9</span>
    </div>
</div>

<script src="https://unpkg.com/@strudel/web@1.0.3"></script>

<script>
const VERSION = 9;

// ── Sample caching ──────────────────────────────────────────
const _originalFetch = window.fetch;
window.fetch = async function(url, opts) {
    const urlStr = typeof url === "string" ? url : url.url || "";
    const shouldCache = urlStr.includes("raw.githubusercontent.com")
        || urlStr.includes("cdn.freesound.org")
        || urlStr.endsWith(".wav") || urlStr.endsWith(".mp3")
        || urlStr.endsWith(".ogg") || urlStr.endsWith(".json");
    if (!shouldCache) return _originalFetch(url, opts);
    try {
        const cache = await caches.open("strudel-samples-v1");
        const cached = await cache.match(urlStr);
        if (cached) return cached;
        const response = await _originalFetch(url, opts);
        if (response.ok) cache.put(urlStr, response.clone());
        return response;
    } catch (e) { return _originalFetch(url, opts); }
};

// ── State ───────────────────────────────────────────────────
let ws = null;
let reconnectTimer = null;
let strudelReady = false;
let diag = {};  // diagnostics sent with ready message

const logEl     = document.getElementById("log");
const dot       = document.getElementById("dot");
const connLabel = document.getElementById("conn-status");
const initStatus = document.getElementById("init-status");

// ── Catch silent errors from .play() → initDone.then() chain ─
window.addEventListener("unhandledrejection", (e) => {
    const msg = e.reason?.message || String(e.reason);
    addEntry("[unhandled rejection] " + msg, false, msg);
});

// ── Initialize Strudel ──────────────────────────────────────
initStrudel();

// Wrap Pattern.prototype.play to debug the initDone → setPattern chain
(function patchPlay() {
    const checkPlay = setInterval(() => {
        if (typeof Pattern === "undefined" || !Pattern.prototype.play) return;
        clearInterval(checkPlay);
        const _origPlay = Pattern.prototype.play;
        Pattern.prototype.play = function() {
            addEntry("[play] .play() called — scheduling via initDone", true, null);
            _origPlay.call(this);
        };
    }, 50);
})();

(async function init() {
    // Poll for window.evaluate — set by defaultPrebake's evalScope
    let attempts = 0;
    while (typeof window.evaluate !== "function" && attempts < 100) {
        await new Promise(r => setTimeout(r, 100));
        attempts++;
    }
    diag.evaluateFound = typeof window.evaluate === "function";
    diag.evaluateWaitMs = attempts * 100;

    // Load sample banks from Strudel CDN
    // (initStrudel does NOT load samples by default — we must do it explicitly)
    diag.samplesAvail = typeof window.samples === "function";
    if (typeof window.samples === "function") {
        const cdn = "https://strudel.b-cdn.net";
        try {
            initStatus.textContent = "Loading samples...";
            await Promise.all([
                samples(`${cdn}/tidal-drum-machines.json`, `${cdn}/tidal-drum-machines/machines/`),
                samples(`${cdn}/uzu-drumkit.json`, `${cdn}/uzu-drumkit/`),
                samples(`${cdn}/piano.json`, `${cdn}/piano/`),
                samples(`${cdn}/vcsl.json`, `${cdn}/VCSL/`),
            ]);
            diag.defaultSamples = "loaded";
        } catch(e) {
            diag.defaultSamples = "error: " + e.message;
        }
    }

    // Check what globals are available from evalScope
    diag.hushAvail = typeof window.hush === "function";
    diag.stackAvail = typeof window.stack === "function";
    diag.sAvail = typeof window.s === "function";
    diag.getAudioCtxAvail = typeof window.getAudioContext === "function";

    strudelReady = true;
    initStatus.textContent = "Ready — click above to start";
})();

// ── Console ─────────────────────────────────────────────────
function addEntry(code, ok, errorMsg) {
    const el = document.createElement("div");
    el.className = "entry " + (ok ? "ok" : "err");
    const ts = new Date().toLocaleTimeString();
    const badge = ok ? "OK" : "ERR: " + errorMsg;
    el.innerHTML =
        `<div class="meta">${ts}</div>` +
        `<pre>${escapeHTML(code)}</pre>` +
        `<span class="badge">${escapeHTML(badge)}</span>`;
    logEl.appendChild(el);
    while (logEl.children.length > 500) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
}

function escapeHTML(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── WebSocket ───────────────────────────────────────────────
function connect() {
    if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
    ws = new WebSocket("ws://localhost:8765");

    ws.addEventListener("open", () => {
        dot.classList.add("connected");
        connLabel.textContent = "Connected";
        const sendReady = () => {
            ws.send(JSON.stringify({ type: "ready", version: VERSION, diag }));
        };
        if (strudelReady) sendReady();
        else {
            const poll = setInterval(() => {
                if (strudelReady) { clearInterval(poll); sendReady(); }
            }, 100);
        }

    });

    ws.addEventListener("message", (evt) => {
        let msg;
        try { msg = JSON.parse(evt.data); } catch { return; }
        if (msg.type === "execute") {
            executeCode(msg.code, msg.id, !!msg.evaluate);
        }
    });

    ws.addEventListener("close", () => {
        dot.classList.remove("connected");
        connLabel.textContent = "Disconnected — reconnecting...";
        if (!reconnectTimer) {
            reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, 2000);
        }
    });

    ws.addEventListener("error", () => {});
}

function sendResponse(id, success, errorMessage) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify(success
        ? { type: "status", id, success: true }
        : { type: "error", id, message: errorMessage }
    ));
}

// ── Execute code ────────────────────────────────────────────
//
// Two modes:
//   evaluate=false (default): use eval() — for hush(), samples(), etc.
//   evaluate=true:  use window.evaluate() — for patterns.
//     The standalone evaluate() transpiles mini-notation strings,
//     evaluates via Function(), and calls .play() on the result.

async function executeCode(code, id, useEvaluate) {
    try {
        if (useEvaluate && typeof window.evaluate === "function") {
            await window.evaluate(code, true);
        } else {
            const result = eval(code);
            if (result && typeof result.then === "function") {
                await result;
            }
        }
        addEntry(code, true, null);
        sendResponse(id, true);
    } catch (err) {
        const msg = err.message || String(err);
        addEntry(code, false, msg);
        sendResponse(id, false, msg);
    }
}

// ── Start ───────────────────────────────────────────────────
document.getElementById("start-btn").addEventListener("click", async () => {
    // Resume AudioContext — required by browser autoplay policy.
    // Try Strudel's getAudioContext first, fall back to creating one.
    let acState = "no-context";
    try {
        const ac = typeof getAudioContext === "function"
            ? getAudioContext()
            : new AudioContext();
        acState = ac.state;
        if (ac.state === "suspended") await ac.resume();
        acState = ac.state;

        // Test beep — confirms audio pipeline is working
        const osc = ac.createOscillator();
        osc.frequency.value = 440;
        const g = ac.createGain();
        g.gain.value = 0.08;
        osc.connect(g).connect(ac.destination);
        osc.start();
        setTimeout(() => osc.stop(), 150);
    } catch (e) {
        acState = "error: " + e.message;
    }

    diag.audioState = acState;

    document.getElementById("overlay").style.display = "none";
    document.getElementById("console").style.display = "flex";
    connect();
});
</script>
</body>
</html>
