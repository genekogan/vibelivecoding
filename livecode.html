<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>vibe live coding v1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            color: #c8c8c8;
        }

        canvas { display: block; }

        #overlay {
            position: fixed; inset: 0;
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 100;
        }

        #overlay button {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 18px 40px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.15s;
        }

        #overlay button:hover { background: #ff6b80; }

        #init-status { font-size: 12px; color: #555; }

        /* Code overlay — toggled with C key */
        #code-overlay {
            position: fixed;
            top: 0; right: 0;
            width: 420px;
            max-height: 100%;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.75);
            padding: 16px;
            font-size: 12px;
            line-height: 1.5;
            z-index: 50;
            pointer-events: none;
            display: none;
        }

        #code-overlay .section-header {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #333;
        }

        #code-overlay .section-header.strudel { color: #e94560; }
        #code-overlay .section-header.p5 { color: #7b5ea7; }

        #code-overlay .section { margin-bottom: 16px; }

        #code-overlay .layer-block {
            margin-bottom: 8px;
            border-left: 2px solid #7b5ea7;
            padding-left: 10px;
        }

        #code-overlay .layer-block.track {
            border-left-color: #e94560;
        }

        #code-overlay .layer-name {
            font-weight: 600;
            margin-bottom: 2px;
        }

        #code-overlay .layer-name.track { color: #ff6b80; }
        #code-overlay .layer-name.layer { color: #9b7ec8; }

        #code-overlay pre {
            color: #a6e3a1;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Console footer */
        #footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            border-top: 1px solid #222;
            padding: 6px 16px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #555;
            background: rgba(0, 0, 0, 0.8);
            z-index: 50;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: #e94560; flex-shrink: 0; }
        .dot.connected { background: #a6e3a1; }

        /* Execution log — toggled with L key */
        #exec-log {
            position: fixed;
            bottom: 30px; left: 0;
            width: 500px;
            max-height: 250px;
            overflow-y: auto;
            padding: 8px 12px;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.6);
            pointer-events: none;
            z-index: 50;
            display: none;
        }

        #exec-log .log-entry { margin-bottom: 4px; color: #666; }
        #exec-log .log-entry.ok { color: #a6e3a1; }
        #exec-log .log-entry.err { color: #e94560; }
        #exec-log .log-entry .tag {
            display: inline-block;
            font-size: 9px;
            font-weight: 600;
            padding: 0 4px;
            border-radius: 2px;
            margin-right: 4px;
        }
        #exec-log .log-entry .tag.strudel { background: #3a1a1a; color: #e94560; }
        #exec-log .log-entry .tag.p5 { background: #1a1a3a; color: #7b5ea7; }

        /* Step toast — big centered label on section change */
        #step-toast {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1);
            font-size: 48px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 40px rgba(233,69,96,0.8), 0 0 80px rgba(233,69,96,0.4);
            pointer-events: none;
            z-index: 60;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            text-align: center;
            line-height: 1.3;
        }
        #step-toast.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        #step-toast .toast-section {
            font-size: 18px;
            font-weight: 400;
            color: #e94560;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #code-overlay::-webkit-scrollbar,
        #exec-log::-webkit-scrollbar { width: 4px; }
        #code-overlay::-webkit-scrollbar-track,
        #exec-log::-webkit-scrollbar-track { background: transparent; }
        #code-overlay::-webkit-scrollbar-thumb,
        #exec-log::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    </style>
</head>
<body>

<div id="overlay">
    <button id="start-btn">Start Audio & Visuals (v1)</button>
    <div id="init-status">Loading...</div>
</div>

<video id="video-player" preload="auto" playsinline
       style="position:fixed; inset:0; width:100%; height:100%; object-fit:fill;
              background:#000; z-index:90; display:none;"></video>

<div id="step-toast"></div>
<div id="code-overlay"></div>
<div id="exec-log"></div>

<div id="footer" style="display:none">
    <div class="dot" id="dot"></div>
    <span id="conn-status">Disconnected</span>
    <span style="margin-left:auto">
        <span id="step-display" style="color:#e94560;display:none">◀ <span id="step-info">0/0</span> ▶</span>
        <span id="step-label" style="color:#ff6b80;font-weight:600;display:none"></span> |
        <span id="track-count">0 tracks</span> |
        <span id="layer-count">0 layers</span> |
        <span id="fps-display">--</span> fps |
        v1 | [C] code [L] log [←→] steps
    </span>
</div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
<script src="https://unpkg.com/@strudel/web@1.0.3"></script>

<script>
const VERSION = 2;

// ── Sample caching (from strudel.html) ──────────────────────
const _originalFetch = window.fetch;
window.fetch = async function(url, opts) {
    const urlStr = typeof url === "string" ? url : url.url || "";
    const shouldCache = urlStr.includes("raw.githubusercontent.com")
        || urlStr.includes("cdn.freesound.org")
        || urlStr.endsWith(".wav") || urlStr.endsWith(".mp3")
        || urlStr.endsWith(".ogg") || urlStr.endsWith(".json");
    if (!shouldCache) return _originalFetch(url, opts);
    try {
        const cache = await caches.open("strudel-samples-v1");
        const cached = await cache.match(urlStr);
        if (cached) return cached;
        const response = await _originalFetch(url, opts);
        if (response.ok) cache.put(urlStr, response.clone());
        return response;
    } catch (e) { return _originalFetch(url, opts); }
};

// ── State ───────────────────────────────────────────────────
let ws = null;
let reconnectTimer = null;
let strudelReady = false;
let p5Ready = false;
let showCode = false;
let showLog = false;
let diag = {};

// p5 layer system
const p5Layers = new Map();
const layerOrder = [];
window.state = {};
window.state.audio = { bass: 0, lowmid: 0, mid: 0, treble: 0, rms: 0, fft: [] };
const errorTimestamps = new Map();

// ── Audio-reactive bridge ───────────────────────────────────
// Intercepts any WebAudio node connecting to the context destination and
// reroutes it through a tap (gain → analyser → destination), so Strudel's
// output is analysable regardless of superdough internals. Publishes
// window.state.audio = {bass, lowmid, mid, treble, rms, fft[32]} every rAF.
// Caveat: node.disconnect(ctx.destination) won't match the rerouted edge —
// superdough uses bare disconnect() so this doesn't bite in practice.
(function () {
    const origConnect = AudioNode.prototype.connect;
    let tap = null;
    function getTap(ctx) {
        if (tap && tap.ctx === ctx) return tap;
        const input = ctx.createGain();
        const an = ctx.createAnalyser();
        an.fftSize = 2048;               // ~21.5Hz/bin @44.1kHz — resolves kick fundamentals
        an.smoothingTimeConstant = 0.6;
        origConnect.call(input, an);
        origConnect.call(input, ctx.destination);
        tap = { ctx, input, an,
                freq: new Uint8Array(an.frequencyBinCount),
                wave: new Uint8Array(an.fftSize) };
        startMeter();
        return tap;
    }
    AudioNode.prototype.connect = function (target, ...rest) {
        // Only tap REAL-TIME contexts. Superdough renders reverb impulse
        // responses in an OfflineAudioContext whose destination is also an
        // AudioDestinationNode — tapping it would REPLACE the singleton tap
        // with one on a context that renders once and stops, freezing
        // state.audio at stale values forever (observed on first .room()).
        if (target instanceof AudioDestinationNode
                && !(target.context instanceof OfflineAudioContext)) {
            return origConnect.call(this, getTap(target.context).input, ...rest);
        }
        return origConnect.call(this, target, ...rest);
    };
    // Symmetric intercept: a node that connected "to destination" actually holds
    // an edge to tap.input, so disconnect(destination) must target tap.input or
    // it throws InvalidAccessError inside superdough (observed: first .room()
    // reverb init rewires the orbit output, the throw derails the rebuild, and
    // the analyser subgraph goes inactive — state.audio freezes at stale values).
    const origDisconnect = AudioNode.prototype.disconnect;
    AudioNode.prototype.disconnect = function (target, ...rest) {
        if (target instanceof AudioDestinationNode && tap && tap.ctx === target.context) {
            try { return origDisconnect.call(this, tap.input, ...rest); }
            catch (e) { /* edge may predate the tap — fall through */ }
            return origDisconnect.call(this, target, ...rest);
        }
        if (target === undefined) return origDisconnect.call(this);
        return origDisconnect.call(this, target, ...rest);
    };
    let meterOn = false;
    function startMeter() {
        if (meterOn) return;
        meterOn = true;
        const band = (f, a, b) => {
            let s = 0;
            for (let i = a; i < b; i++) s += f[i];
            return s / ((b - a) * 255);
        };
        function tick() {
            if (tap) {
                tap.an.getByteFrequencyData(tap.freq);
                tap.an.getByteTimeDomainData(tap.wave);
                let s = 0;
                for (let i = 0; i < tap.wave.length; i++) {
                    const v = (tap.wave[i] - 128) / 128;
                    s += v * v;
                }
                const f = tap.freq;
                const nb = f.length; // 1024 bins
                const fft = new Array(32);
                for (let i = 0; i < 32; i++) {
                    // log-ish packing: first 16 bins raw (0–344Hz), then widening groups
                    const a = i < 16 ? i : Math.floor(16 * Math.pow(nb / 16, (i - 16) / 16));
                    const b = i < 16 ? i + 1 : Math.floor(16 * Math.pow(nb / 16, (i - 15) / 16));
                    fft[i] = band(f, a, Math.max(b, a + 1));
                }
                window.state.audio = {
                    bass:   band(f, 1, 8),      // ~21–172 Hz (kick, sub)
                    lowmid: band(f, 8, 24),     // ~172–516 Hz
                    mid:    band(f, 24, 120),   // ~516 Hz–2.6 kHz
                    treble: band(f, 120, 512),  // ~2.6–11 kHz (hats, air)
                    rms: Math.sqrt(s / tap.wave.length),
                    fft,
                };
            }
            requestAnimationFrame(tick);
        }
        tick();
    }
})();

// Strudel track names (for code overlay display; actual code managed server-side)
const strudelTracks = new Map();

const dot = document.getElementById("dot");
const connLabel = document.getElementById("conn-status");
const initStatus = document.getElementById("init-status");
const codeOverlay = document.getElementById("code-overlay");
const execLog = document.getElementById("exec-log");
const trackCountEl = document.getElementById("track-count");
const layerCountEl = document.getElementById("layer-count");
const fpsDisplayEl = document.getElementById("fps-display");

// ── Catch unhandled rejections (Strudel) ────────────────────
window.addEventListener("unhandledrejection", (e) => {
    const msg = e.reason?.message || String(e.reason);
    addLogEntry("strudel", "[unhandled] " + msg, false);
});

// ── Initialize Strudel ──────────────────────────────────────
initStatus.textContent = "Loading Strudel...";
initStrudel();

// Wrap Pattern.prototype.play for debug
(function patchPlay() {
    const checkPlay = setInterval(() => {
        if (typeof Pattern === "undefined" || !Pattern.prototype.play) return;
        clearInterval(checkPlay);
        const _origPlay = Pattern.prototype.play;
        Pattern.prototype.play = function() {
            addLogEntry("strudel", ".play() called", true);
            _origPlay.call(this);
        };
    }, 50);
})();

(async function initStrudelAsync() {
    // Poll for window.evaluate
    let attempts = 0;
    while (typeof window.evaluate !== "function" && attempts < 100) {
        await new Promise(r => setTimeout(r, 100));
        attempts++;
    }
    diag.evaluateFound = typeof window.evaluate === "function";
    diag.evaluateWaitMs = attempts * 100;

    // Load sample banks
    diag.samplesAvail = typeof window.samples === "function";
    if (typeof window.samples === "function") {
        const cdn = "https://strudel.b-cdn.net";
        try {
            initStatus.textContent = "Loading samples...";
            await Promise.all([
                samples(`${cdn}/tidal-drum-machines.json`, `${cdn}/tidal-drum-machines/machines/`),
                samples(`${cdn}/uzu-drumkit.json`, `${cdn}/uzu-drumkit/`),
                samples(`${cdn}/piano.json`, `${cdn}/piano/`),
                samples(`${cdn}/vcsl.json`, `${cdn}/VCSL/`),
            ]);
            diag.defaultSamples = "loaded";
        } catch(e) {
            diag.defaultSamples = "error: " + e.message;
        }
    }

    diag.hushAvail = typeof window.hush === "function";
    diag.stackAvail = typeof window.stack === "function";
    diag.getAudioCtxAvail = typeof window.getAudioContext === "function";

    strudelReady = true;
    checkAllReady();
})();

// ── p5.js sketch (global mode) ──────────────────────────────
window.setup = function() {
    createCanvas(windowWidth, windowHeight);
    pixelDensity(1);   // retina fill-rate: ~3-4x cheaper, protects the 20fps floor
    colorMode(HSB, 360, 100, 100, 100);
    background(0);
};

// Clock authority: sole beat/tempo truth for every layer. Layers read
// window.state.clk — never frameCount-based beat math (breaks below 60fps
// and on tempo change). state.cps is pushed by the server on /strudel/cps;
// scene transitions null state.t0 to restart the section arc.
function updateClock() {
    const cps = window.state.cps || 0.5;
    if (window.state.t0 == null) window.state.t0 = millis() / 1000;
    const t = millis() / 1000 - window.state.t0;
    const beat = t * cps * 4;                      // 4 beats per cycle
    const secBeats = window.state.secBeats || 32;  // 8 bars per section default
    const section = Math.floor(beat / secBeats) % 8;
    const arc = window.state.arc || [.2, .4, .7, .9, .3, .6, 1, .4];
    window.state.clk = {
        t, cps, beat,
        bar: beat / 4,
        cyc: (beat / 4) % 1,
        phase: beat % 1,                                   // 0 at each beat onset
        pulse: Math.pow(1 - (beat % 1), 3),                // spikes on the beat, decays
        swell: Math.pow(Math.max(0, Math.sin((beat % 1) * Math.PI)), 2),
        section,
        intensity: arc[section % arc.length],
        fps: frameRate(),
    };
}

window.draw = function() {
    updateClock();
    for (const name of layerOrder) {
        const layer = p5Layers.get(name);
        if (!layer) continue;
        try {
            push();
            layer.fn();
            pop();
        } catch (e) {
            pop();
            const now = Date.now();
            const last = errorTimestamps.get(name) || 0;
            if (now - last > 1000) {
                errorTimestamps.set(name, now);
                addLogEntry("p5", `[${name}] runtime: ${e.message}`, false);
            }
        }
    }

    if (frameCount % 30 === 0) {
        fpsDisplayEl.textContent = Math.round(frameRate());
    }
};

window.windowResized = function() {
    resizeCanvas(windowWidth, windowHeight);
};

p5Ready = true;

function checkAllReady() {
    if (p5Ready && strudelReady) {
        initStatus.textContent = "Ready — click above to start";
    } else if (p5Ready) {
        initStatus.textContent = "p5 ready, loading Strudel...";
    }
}
checkAllReady();

// ── p5 Layer management ─────────────────────────────────────
function setLayer(name, code) {
    try {
        const fn = new Function(code);
        p5Layers.set(name, { fn, code });
        if (!layerOrder.includes(name)) {
            layerOrder.push(name);
        }
        updateCounts();
        updateCodeOverlay();
        return { success: true };
    } catch (e) {
        return { success: false, error: e.message };
    }
}

function removeLayer(name) {
    p5Layers.delete(name);
    const idx = layerOrder.indexOf(name);
    if (idx !== -1) layerOrder.splice(idx, 1);
    errorTimestamps.delete(name);
    updateCounts();
    updateCodeOverlay();
}

function clearAllLayers() {
    p5Layers.clear();
    layerOrder.length = 0;
    errorTimestamps.clear();
    background(0);
    updateCounts();
    updateCodeOverlay();
}

// ── Hard recompile ──────────────────────────────────────────
function hardRecompile(setupCode) {
    const savedState = window.state;
    const savedLayers = [];
    for (const name of layerOrder) {
        const layer = p5Layers.get(name);
        if (layer) savedLayers.push({ name, code: layer.code });
    }

    if (window._renderer) {
        remove();
    }

    window.setup = function() {
        new Function(setupCode)();
        window.state = savedState;
    };

    new p5();

    clearAllLayers();
    for (const { name, code } of savedLayers) {
        setLayer(name, code);
    }
}

// ── UI updates ──────────────────────────────────────────────
function updateCounts() {
    trackCountEl.textContent = strudelTracks.size + " track" + (strudelTracks.size !== 1 ? "s" : "");
    layerCountEl.textContent = layerOrder.length + " layer" + (layerOrder.length !== 1 ? "s" : "");
}

function updateCodeOverlay() {
    if (!showCode) return;
    let html = "";

    // Strudel tracks section
    if (strudelTracks.size > 0) {
        html += '<div class="section"><div class="section-header strudel">Strudel Tracks</div>';
        for (const [name, code] of strudelTracks) {
            html += `<div class="layer-block track">` +
                `<div class="layer-name track">${escapeHTML(name)}</div>` +
                `<pre>${escapeHTML(code)}</pre>` +
                `</div>`;
        }
        html += '</div>';
    }

    // p5 layers section
    if (layerOrder.length > 0) {
        html += '<div class="section"><div class="section-header p5">p5 Layers</div>';
        for (const name of layerOrder) {
            const layer = p5Layers.get(name);
            if (!layer) continue;
            html += `<div class="layer-block">` +
                `<div class="layer-name layer">${escapeHTML(name)}</div>` +
                `<pre>${escapeHTML(layer.code)}</pre>` +
                `</div>`;
        }
        html += '</div>';
    }

    codeOverlay.innerHTML = html || '<div style="color:#555">No tracks or layers</div>';
}

// ── Execution log ───────────────────────────────────────────
function addLogEntry(system, text, ok) {
    const el = document.createElement("div");
    el.className = "log-entry " + (ok ? "ok" : "err");
    const ts = new Date().toLocaleTimeString();
    const tagClass = system === "strudel" ? "strudel" : "p5";
    el.innerHTML = `<span class="tag ${tagClass}">${system}</span>[${ts}] ${escapeHTML(text)}`;
    execLog.appendChild(el);
    while (execLog.children.length > 200) execLog.removeChild(execLog.firstChild);
    execLog.scrollTop = execLog.scrollHeight;

    // Autopilot: forward failures to the server so the improv loop can self-correct.
    if (!ok && ws && ws.readyState === WebSocket.OPEN) {
        try {
            ws.send(JSON.stringify({ type: "log_error", system, message: text, ts: Date.now() }));
        } catch (e) { /* logging must never break rendering */ }
    }
}

function escapeHTML(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ── Step navigation ─────────────────────────────────────────
const stepDisplayEl = document.getElementById("step-display");
const stepInfoEl = document.getElementById("step-info");
const stepLabelEl = document.getElementById("step-label");
const stepToast = document.getElementById("step-toast");
let currentStep = -1;
let totalSteps = 0;
let toastTimer = null;

function updateStepDisplay(data) {
    const prevLabel = stepLabelEl.textContent;
    currentStep = data.step;
    totalSteps = data.total;
    if (data.total > 0) {
        stepDisplayEl.style.display = "inline";
        const sec = data.section || 0;
        const totalSec = data.totalSections || data.total;
        stepInfoEl.textContent = `${sec}/${totalSec}`;
        if (data.label) {
            stepLabelEl.style.display = "inline";
            stepLabelEl.textContent = data.label;
            // Show big toast when section changes
            if (data.label !== prevLabel) {
                showToast(data.label, sec, totalSec);
            }
        } else {
            stepLabelEl.style.display = "none";
        }
    } else {
        stepDisplayEl.style.display = "none";
        stepLabelEl.style.display = "none";
    }
}

function showToast(label, sec, totalSec) {
    if (toastTimer) clearTimeout(toastTimer);
    stepToast.innerHTML = `${escapeHTML(label)}<div class="toast-section">Section ${sec} of ${totalSec}</div>`;
    stepToast.classList.add("visible");
    toastTimer = setTimeout(() => {
        stepToast.classList.remove("visible");
    }, 2000);
}

function stepNav(direction) {
    const port = location.port;
    const route = direction === "next" ? "/show/next" : "/show/prev";
    fetch(`http://${location.hostname}:${port}${route}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: "{}",
    }).catch(() => {});
}

// ── Keyboard shortcuts ──────────────────────────────────────
document.addEventListener("keydown", (e) => {
    if (e.key === "c" || e.key === "C") {
        showCode = !showCode;
        codeOverlay.style.display = showCode ? "block" : "none";
        if (showCode) updateCodeOverlay();
    }
    if (e.key === "l" || e.key === "L") {
        showLog = !showLog;
        execLog.style.display = showLog ? "block" : "none";
    }
    if (e.key === "ArrowRight") {
        e.preventDefault();
        stepNav("next");
    }
    if (e.key === "ArrowLeft") {
        e.preventDefault();
        stepNav("prev");
    }
});

// ── WebSocket ───────────────────────────────────────────────
function connect() {
    if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
    const wsPort = new URLSearchParams(location.search).get("ws") || (parseInt(location.port, 10) - 1);
    ws = new WebSocket(`ws://${location.hostname}:${wsPort}`);

    ws.addEventListener("open", () => {
        dot.classList.add("connected");
        connLabel.textContent = "Connected";

        diag.p5Version = typeof p5 !== "undefined" ? p5.VERSION : "?";
        diag.audioState = "pending";

        const sendReady = () => {
            ws.send(JSON.stringify({ type: "ready", version: VERSION, diag }));
        };
        if (strudelReady) sendReady();
        else {
            const poll = setInterval(() => {
                if (strudelReady) { clearInterval(poll); sendReady(); }
            }, 100);
        }
    });

    ws.addEventListener("message", (evt) => {
        let msg;
        try { msg = JSON.parse(evt.data); } catch { return; }

        if (msg.type === "step_update") {
            updateStepDisplay(msg);
            return;
        }

        if (msg.type !== "execute") return;

        if (msg.target === "strudel") {
            executeStrudelCode(msg.code, msg.id, !!msg.evaluate);
        } else if (msg.target === "video") {
            executeVideoMessage(msg);
        } else {
            // Default target is p5
            executeP5Message(msg);
        }
    });

    ws.addEventListener("close", () => {
        dot.classList.remove("connected");
        connLabel.textContent = "Disconnected — reconnecting...";
        if (!reconnectTimer) {
            reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, 2000);
        }
    });

    ws.addEventListener("error", () => {});
}

function sendResponse(id, success, errorMessage, result) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    let payload;
    if (success) {
        payload = { type: "status", id, success: true };
        if (result !== undefined) {
            try { payload.result = JSON.parse(JSON.stringify(result)); }
            catch (e) { payload.result = String(result); }
        }
    } else {
        payload = { type: "error", id, message: errorMessage };
    }
    ws.send(JSON.stringify(payload));
}

// ── Audio context keep-alive ────────────────────────────────
// A fullscreen video segment hushes Strudel; the AudioContext then sits idle and
// some browsers auto-suspend it. Re-evaluating tracks on resume would set the
// pattern but produce no sound. So resume the context before every evaluation.
async function ensureAudioRunning() {
    try {
        const ac = typeof getAudioContext === "function" ? getAudioContext() : null;
        if (ac && ac.state === "suspended") await ac.resume();
    } catch (e) {}
}

// ── Execute Strudel code ────────────────────────────────────
async function executeStrudelCode(code, id, useEvaluate) {
    try {
        if (useEvaluate && typeof window.evaluate === "function") {
            // Track the code for overlay display
            // Parse track names from stack() or single pattern
            trackStrudelCode(code);
            await ensureAudioRunning();
            await window.evaluate(code, true);
        } else {
            // Plain eval — hush(), samples(), etc.
            if (code.trim() === "hush()") {
                strudelTracks.clear();
                updateCounts();
                updateCodeOverlay();
            }
            const result = eval(code);
            if (result && typeof result.then === "function") {
                await result;
            }
        }
        addLogEntry("strudel", code.substring(0, 80), true);
        sendResponse(id, true);
    } catch (err) {
        const msg = err.message || String(err);
        addLogEntry("strudel", msg, false);
        sendResponse(id, false, msg);
    }
}

function trackStrudelCode(code) {
    // For code overlay: try to show what's playing
    // We display the whole evaluated code as "active pattern"
    strudelTracks.clear();
    strudelTracks.set("pattern", code);
    updateCounts();
    updateCodeOverlay();
}

// ── Execute p5 message ──────────────────────────────────────
function executeP5Message(msg) {
    const { code, id, mode, layer } = msg;

    try {
        switch (mode) {
            case "layer": {
                const result = setLayer(layer, code);
                if (result.success) {
                    addLogEntry("p5", `layer "${layer}" set (${code.length} chars)`, true);
                    sendResponse(id, true);
                } else {
                    addLogEntry("p5", `layer "${layer}" error: ${result.error}`, false);
                    sendResponse(id, false, result.error);
                }
                break;
            }
            case "remove": {
                removeLayer(layer);
                addLogEntry("p5", `layer "${layer}" removed`, true);
                sendResponse(id, true);
                break;
            }
            case "clear": {
                clearAllLayers();
                addLogEntry("p5", "all layers cleared", true);
                sendResponse(id, true);
                break;
            }
            case "setup": {
                hardRecompile(code);
                addLogEntry("p5", "hard recompile (setup changed)", true);
                sendResponse(id, true);
                break;
            }
            case "eval":
            default: {
                const result = eval(code);
                if (result && typeof result.then === "function") {
                    result.then((resolved) => {
                        addLogEntry("p5", code.substring(0, 80), true);
                        sendResponse(id, true, null, resolved);
                    }).catch((err) => {
                        addLogEntry("p5", `eval error: ${err.message}`, false);
                        sendResponse(id, false, err.message);
                    });
                } else {
                    addLogEntry("p5", code.substring(0, 80), true);
                    sendResponse(id, true, null, result);
                }
                break;
            }
        }
    } catch (err) {
        const errMsg = err.message || String(err);
        addLogEntry("p5", `error: ${errMsg}`, false);
        sendResponse(id, false, errMsg);
    }
}

// ── Execute video message ───────────────────────────────────
// Fullscreen mp4 player. The browser owns sequential playback (auto-advances on
// 'ended') and reports progress back as {type:"video_update", ...} so the server
// can mark dropbox files seen and the autopilot knows when the batch is done.
const videoEl = document.getElementById("video-player");
let videoPlaylist = [];
let videoIdx = -1;
let videoActive = false;

function videoReport(extra) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const cur = (videoIdx >= 0 && videoIdx < videoPlaylist.length) ? videoPlaylist[videoIdx] : null;
    try {
        ws.send(JSON.stringify(Object.assign({
            type: "video_update",
            index: videoIdx,
            total: videoPlaylist.length,
            current: cur ? cur.key : null,
        }, extra || {})));
    } catch (e) { /* never break playback on a report failure */ }
}

function videoTeardown() {
    videoEl.pause();
    videoEl.removeAttribute("src");
    try { videoEl.load(); } catch (e) {}  // releases the decoder (may fire a benign 'error')
    videoEl.style.display = "none";
}

function videoAdvance() {
    const next = videoIdx + 1;
    if (next >= videoPlaylist.length) {  // playlist exhausted → hard end
        videoActive = false;
        videoReport({ ended: true, playlistDone: true });
        videoIdx = -1;
        videoPlaylist = [];
        videoTeardown();
        return;
    }
    videoIdx = next;
    const item = videoPlaylist[videoIdx];
    videoEl.style.display = "block";
    videoEl.src = item.url;
    const p = videoEl.play();
    videoReport({ playing: true });
    if (p && p.catch) {
        p.catch((err) => addLogEntry("video", `play() rejected: ${err.message || err}`, false));
    }
}

videoEl.addEventListener("ended", () => {
    if (!videoActive) return;
    const item = videoPlaylist[videoIdx];
    videoReport({ key: item && item.key, ended: true });  // server marks dropbox seen
    videoAdvance();
});

videoEl.addEventListener("error", () => {
    if (!videoActive) return;  // ignore teardown-triggered errors
    const item = videoPlaylist[videoIdx];
    addLogEntry("video", `error loading ${item ? item.name : "?"}`, false);
    videoReport({ key: item && item.key, ended: false, error: "load failed" });  // NOT marked seen
    videoAdvance();
});

function executeVideoMessage(msg) {
    const mode = msg.mode;
    if (mode === "play") {
        videoPlaylist = (msg.playlist || []).slice();
        videoIdx = -1;
        videoActive = true;
        strudelTracks.clear(); updateCounts(); updateCodeOverlay();  // music hushed server-side
        videoAdvance();
    } else if (mode === "append") {
        videoPlaylist = videoPlaylist.concat(msg.playlist || []);
        if (!videoActive) { videoActive = true; videoAdvance(); }  // resume if it had ended
    } else if (mode === "stop") {
        videoActive = false;
        videoIdx = -1;
        videoPlaylist = [];
        videoTeardown();
        ensureAudioRunning();  // wake the context so the resumed music is audible
    }
}

// ── Start ───────────────────────────────────────────────────
document.getElementById("start-btn").addEventListener("click", async () => {
    // Resume AudioContext
    let acState = "no-context";
    try {
        const ac = typeof getAudioContext === "function"
            ? getAudioContext()
            : new AudioContext();
        acState = ac.state;
        if (ac.state === "suspended") await ac.resume();
        acState = ac.state;

        // Test beep
        const osc = ac.createOscillator();
        osc.frequency.value = 440;
        const g = ac.createGain();
        g.gain.value = 0.08;
        osc.connect(g).connect(ac.destination);
        osc.start();
        setTimeout(() => osc.stop(), 150);
    } catch (e) {
        acState = "error: " + e.message;
    }

    diag.audioState = acState;

    document.getElementById("overlay").style.display = "none";
    document.getElementById("footer").style.display = "flex";
    connect();
});
</script>
</body>
</html>
